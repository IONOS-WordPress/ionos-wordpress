name: 'devcontainer image name'
description: |
  compute the dev container image reference. the repository is constructed from the
  repository owner/name (lowercased, ghcr.io rejects uppercase) and the tag is the
  shared date-based tag of .devcontainer - the same '<image>:<tag>' scheme every other
  image published from this repository uses (see
  .github/shared/scripts/docker-subproject-image-tag.sh).

  example : ghcr.io/ionos-wordpress/ionos-wordpress-devcontainer:2025-12-24-14-48-33

  repository and tag are exposed separately because devcontainers/ci takes them as two
  inputs (imageName/imageTag) and appends ':latest' to an imageName that already carries
  a tag; image_name is the joined reference for 'docker manifest inspect'/cacheFrom.

  requires the caller to check out with 'fetch-depth: 0'.

outputs:
  image_name:
    description: 'the full image reference (<repository>:<tag>)'
    value: ${{ steps.compute_image_name.outputs.image_name }}
  image_repository:
    description: 'the image repository without tag (devcontainers/ci imageName input)'
    value: ${{ steps.compute_image_name.outputs.image_repository }}
  image_tag:
    description: 'the image tag (devcontainers/ci imageTag input)'
    value: ${{ steps.compute_image_name.outputs.image_tag }}

runs:
  using: 'composite'
  steps:
    - uses: './.github/shared/actions/docker-subproject-image-name'
      id: image_tag
      with:
        path: .devcontainer

    - id: compute_image_name
      shell: bash
      run: |
        # ghcr.io repository names must be lowercase, GITHUB_REPOSITORY is not
        # (example value : "ghcr.io/ionos-wordpress/ionos-wordpress-devcontainer")
        image_repository="ghcr.io/${GITHUB_REPOSITORY}-devcontainer"
        image_repository="${image_repository@L}"
        image_tag='${{ steps.image_tag.outputs.tag }}'
        {
          echo "image_repository=${image_repository}"
          echo "image_tag=${image_tag}"
          echo "image_name=${image_repository}:${image_tag}"
        } >> "$GITHUB_OUTPUT"
