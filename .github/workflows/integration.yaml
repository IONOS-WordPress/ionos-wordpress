#
# this is the integration workflow that is triggered by a push to the develop branches
#
# it will
# - build the project
# - test the project
# - gather the workflow artifacts
#
name: 'integration'

on:
  push:
    # run for all branches except main (because testing is also done in pre-release workflow)
    branches-ignore:
      - 'main'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  # write-all is too much, but we need to write to packages
  # see https://github.com/orgs/community/discussions/57724 for more info
  contents: read
  packages: write
  attestations: write
  id-token: write

env:
  # registry/repository the wordpress-alpine image is published to (see
  # build-wordpress-alpine-image.yaml) - same repo vars/defaults, never hardcoded
  IMAGE_REGISTRY: ${{ vars.IMAGE_REGISTRY || 'ghcr.io' }}
  IMAGE_REPOSITORY: ${{ vars.IMAGE_REPOSITORY || 'ionos-wordpress/wordpress-alpine-dev' }}
  # registry repository prefix the rector-php/ecs-php/dennis-i18n
  # docker sub-project images (packages/docker/*) are cached under, one
  # repository per sub-project (e.g. ionos-wordpress/rector-php) - same
  # registry as wordpress-alpine, same vars/defaults convention, never hardcoded
  DOCKER_SUBPROJECT_IMAGE_REPOSITORY_PREFIX: ${{ vars.IMAGE_REPOSITORY_PREFIX || 'ionos-wordpress' }}
  DOCKER_SUBPROJECT_IMAGE_REGISTRY_USERNAME: ${{ secrets.IMAGE_REGISTRY_USERNAME || github.actor }}
  DOCKER_SUBPROJECT_IMAGE_REGISTRY_PASSWORD: ${{ secrets.IMAGE_REGISTRY_PASSWORD || secrets.GITHUB_TOKEN }}

jobs:
  devcontainer:
    uses: ./.github/workflows/build-devcontainer-image.yaml
    secrets: inherit

  build:
    name: build and test
    runs-on: ubuntu-latest
    needs:
      - devcontainer
    steps:
      - name: checkout branch from git
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: './.github/shared/actions/pnpm-store-cache'

      # scripts/test.sh points PLAYWRIGHT_BROWSERS_PATH at this workspace-relative
      # directory when CI=true, instead of the dev container's ~/.cache/ms-playwright -
      # which is discarded together with the container after every step, so the default
      # location meant re-downloading ~300MB of chromium on every run. same reasoning
      # (and same host-side-cache-of-a-bind-mounted-dir trick) as pnpm-store-cache above.
      - uses: actions/cache@v4
        with:
          path: .playwright-browsers
          # the lockfile pins the playwright version, which is what decides the
          # browser build that gets downloaded
          key: ${{ runner.os }}-playwright-browsers-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-browsers-

      - uses: './.github/shared/actions/docker-subproject-image-name'
        id: rector_php_image_tag
        with:
          path: packages/docker/rector-php

      # every 'devcontainer-shell-run' re-runs 'devcontainer build' + 'docker run' and
      # costs ~4s of wall clock even on a full cache hit, so install and both image pulls
      # share one step instead of getting one each (the lint job below does the same).
      # both pulls run inside the devcontainer's docker-in-docker daemon - the same one
      # scripts/build.sh's docker build step runs in - so the pulled/tagged images are
      # actually visible to it (a host-side docker pull/tag would land in a different
      # daemon and be invisible to the build step).
      - uses: './.github/shared/actions/devcontainer-shell-run'
        name: install and pull prebuilt images
        with:
          env: |
            IMAGE_REGISTRY=${{ env.IMAGE_REGISTRY }}
            WORDPRESS_ALPINE_IMAGE_REPOSITORY=${{ env.IMAGE_REPOSITORY }}
            IMAGE_REPOSITORY_PREFIX=${{ env.DOCKER_SUBPROJECT_IMAGE_REPOSITORY_PREFIX }}
            RECTOR_PHP_IMAGE_TAG=${{ steps.rector_php_image_tag.outputs.tag }}
            IMAGE_REGISTRY_USERNAME=${{ env.DOCKER_SUBPROJECT_IMAGE_REGISTRY_USERNAME }}
            IMAGE_REGISTRY_PASSWORD=${{ env.DOCKER_SUBPROJECT_IMAGE_REGISTRY_PASSWORD }}
          # the wordpress-alpine block tags a local ionos-wordpress/wordpress-alpine:<version> from the
          # image built/published by build-wordpress-alpine-image.yaml (Phase 1), so
          # scripts/build.sh's existing "already exists locally" check skips rebuilding it
          # below - no hard dependency on that workflow finishing first: the build step
          # below builds the image locally if the tag isn't published yet/the pull fails
          # (it detects that by the absence of ionos-wordpress/wordpress-alpine:latest, which is
          # only tagged here on a successful pull)
          runCmd: |
            pnpm install --frozen-lockfile

            HASH="$(git rev-parse HEAD:packages/docker/wordpress-alpine)"
            # the default php variant is taken from the same .env that scripts/build.sh
            # passes to 'docker build' for the local fallback below, so the tag pulled
            # here and the image built when the pull fails can never disagree
            DEFAULT_PHP_VERSION="$(grep -E '^ARG_PHP_VERSION=' packages/docker/wordpress-alpine/.env | cut -d= -f2-)"
            IMAGE="${IMAGE_REGISTRY}/${WORDPRESS_ALPINE_IMAGE_REPOSITORY}:${HASH}-php${DEFAULT_PHP_VERSION}"
            echo "$IMAGE_REGISTRY_PASSWORD" | docker login "$IMAGE_REGISTRY" --username "$IMAGE_REGISTRY_USERNAME" --password-stdin

            # retry: ghcr.io answers a burst of pulls (devcontainer image, wordpress-alpine,
            # rector-php, the php:*-cli images) with a secondary rate limit that aborts
            # the transfer mid-layer with a 403 - transient, and a plain local build
            # instead of a ~1s pull costs minutes. only worth retrying while the tag
            # actually exists though: a not-yet-published one never appears by waiting
            # (and if the manifest check is rate-limited too we just fall through to the
            # local build, which is the correct outcome anyway)
            PULLED=no
            for ATTEMPT in 1 2 3; do
              docker pull "$IMAGE" && { PULLED=yes; break; }
              [[ $ATTEMPT -eq 3 ]] && break
              docker manifest inspect "$IMAGE" >/dev/null 2>&1 || break
              echo "pull of $IMAGE failed although the tag exists - retrying in 20s ($ATTEMPT/3) ..."
              sleep 20
            done

            if [[ "$PULLED" == 'yes' ]]; then
              PACKAGE_VERSION="$(jq -r '.version' packages/docker/wordpress-alpine/package.json)"
              docker tag "$IMAGE" "ionos-wordpress/wordpress-alpine:${PACKAGE_VERSION}"
              docker tag "$IMAGE" ionos-wordpress/wordpress-alpine:latest
              touch packages/docker/wordpress-alpine/build-info
            else
              echo "::warning::could not pull prebuilt wordpress-alpine image $IMAGE - falling back to a local build"
            fi

            .github/shared/scripts/docker-subproject-image-pull.sh packages/docker/rector-php "$IMAGE_REGISTRY" "$IMAGE_REPOSITORY_PREFIX/rector-php" "$RECTOR_PHP_IMAGE_TAG"

      - uses: './.github/shared/actions/devcontainer-shell-run'
        name: build project and publish rector-php image
        with:
          env: |
            IMAGE_REGISTRY=${{ env.IMAGE_REGISTRY }}
            IMAGE_REPOSITORY_PREFIX=${{ env.DOCKER_SUBPROJECT_IMAGE_REPOSITORY_PREFIX }}
            RECTOR_PHP_IMAGE_TAG=${{ steps.rector_php_image_tag.outputs.tag }}
            IMAGE_REGISTRY_USERNAME=${{ env.DOCKER_SUBPROJECT_IMAGE_REGISTRY_USERNAME }}
            IMAGE_REGISTRY_PASSWORD=${{ env.DOCKER_SUBPROJECT_IMAGE_REGISTRY_PASSWORD }}
          # the push is a no-op when the pull above hit - docker-subproject-image-push.sh
          # then skips the login + registry round trip
          runCmd: |
            # the 'php:<target>-cli' images scripts/test.sh shells out to for its
            # transpilation-target syntax checks are only needed once the test step runs,
            # but pulling them there puts ~5s on the critical path. fetch them here
            # instead, concurrently with the build, into the same docker-in-docker daemon
            # the test step reuses. failures are ignored - test.sh pulls on demand anyway.
            for RECTOR_CONFIG in packages/docker/rector-php/rector-config-php*.php; do
              TARGET_PHP_VERSION="$(basename "$RECTOR_CONFIG" .php)"
              docker pull --quiet "php:${TARGET_PHP_VERSION#*rector-config-php}-cli" >/dev/null 2>&1 || true
            done &
            PHP_IMAGE_PULL_PID=$!

            # wordpress-alpine is normally pulled/tagged by the step above and needs no build.
            # when that pull did not happen (tag not published yet, or a transient
            # registry failure that outlived the retries there) nothing else would ever
            # create the image and scripts/test.sh below dies with "pull access denied
            # for ionos-wordpress/wordpress-alpine" - so build it here instead.
            WORDPRESS_ALPINE_FILTER=()
            if ! docker image inspect ionos-wordpress/wordpress-alpine:latest >/dev/null 2>&1; then
              echo "::warning::no prebuilt ionos-wordpress/wordpress-alpine:latest available - building it locally"
              WORDPRESS_ALPINE_FILTER=(--filter '@ionos-wordpress/wordpress-alpine')
            fi

            # only build what the test suite actually consumes: the plugins/mu-plugins
            # themselves (bundled JS/CSS, i18n) plus rector-php, which their build step
            # shells out to for PHP-version transpilation. ecs-php/potrans/dennis-i18n
            # are declared workspace deps too, but only used by scripts/lint.sh - building
            # them here would be wasted work.
            pnpm run build --filter './packages/wp-plugin/*' --filter './packages/wp-mu-plugin/*' --filter '@ionos-wordpress/rector-php' "${WORDPRESS_ALPINE_FILTER[@]}"

            wait "$PHP_IMAGE_PULL_PID" || true

            .github/shared/scripts/docker-subproject-image-push.sh packages/docker/rector-php "$IMAGE_REGISTRY" "$IMAGE_REPOSITORY_PREFIX/rector-php" "$RECTOR_PHP_IMAGE_TAG"

      - uses: './.github/shared/actions/devcontainer-shell-run'
        name: test project
        with:
          # E2E_SHARDS splits the playwright e2e run across N throwaway WordPress
          # containers running concurrently (see scripts/test.sh). the specs mutate global
          # WordPress state and contradict each other, so they cannot share one instance -
          # a container per shard is what makes the parallelism safe.
          # 3 is a starting point for the 4-vCPU runner: each shard costs a container
          # (mariadb + php-fpm + caddy) plus a chromium, so pushing this higher trades
          # parallelism against CPU contention. re-measure before changing it.
          runCmd: |
            TEST_PRODUCTION=true E2E_SHARDS=3 pnpm run test

      - uses: './.github/shared/actions/devcontainer-shell-run'
        id: gather_workflow_artifacts
        name: gather_workflow_artifacts
        if: always()
        continue-on-error: true
        with:
          runCmd: |
            pnpm exec ./scripts/_get-workflow-artefacts.sh

      - name: attach workflow artifacts
        uses: actions/upload-artifact@v7
        if: steps.gather_workflow_artifacts.outcome == 'success' && steps.gather_workflow_artifacts.outputs.runCmdOutput != ''
        with:
          include-hidden-files: true
          # see https://github.com/actions/upload-artifact/issues/424
          path: |-
            ${{ steps.gather_workflow_artifacts.outputs.runCmdOutput }}

  lint:
    runs-on: ubuntu-latest
    needs:
      - devcontainer
    steps:
      - name: checkout branch from git
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: './.github/shared/actions/docker-subproject-image-name'
        id: ecs_php_image_tag
        with:
          path: packages/docker/ecs-php
      - uses: './.github/shared/actions/docker-subproject-image-name'
        id: dennis_i18n_image_tag
        with:
          path: packages/docker/dennis-i18n
      - uses: './.github/shared/actions/pnpm-store-cache'

      # every 'devcontainer-shell-run' re-runs 'devcontainer build' + 'docker run'
      # and costs ~6s of wall clock even on a full cache hit - so install and the
      # image pulls share one step instead of getting one each.
      # note: potrans is deliberately absent. 'pnpm run lint' never invokes it -
      # only 'pnpm run lint-fix:i18n' (deepl auto-translation) does, and that is
      # never run in CI. see scripts/lint.sh.
      - uses: './.github/shared/actions/devcontainer-shell-run'
        name: install and pull prebuilt lint images
        with:
          env: |
            IMAGE_REGISTRY=${{ env.IMAGE_REGISTRY }}
            IMAGE_REPOSITORY_PREFIX=${{ env.DOCKER_SUBPROJECT_IMAGE_REPOSITORY_PREFIX }}
            ECS_PHP_IMAGE_TAG=${{ steps.ecs_php_image_tag.outputs.tag }}
            DENNIS_I18N_IMAGE_TAG=${{ steps.dennis_i18n_image_tag.outputs.tag }}
            IMAGE_REGISTRY_USERNAME=${{ env.DOCKER_SUBPROJECT_IMAGE_REGISTRY_USERNAME }}
            IMAGE_REGISTRY_PASSWORD=${{ env.DOCKER_SUBPROJECT_IMAGE_REGISTRY_PASSWORD }}
          runCmd: |
            pnpm install --frozen-lockfile
            .github/shared/scripts/docker-subproject-image-pull.sh packages/docker/ecs-php "$IMAGE_REGISTRY" "$IMAGE_REPOSITORY_PREFIX/ecs-php" "$ECS_PHP_IMAGE_TAG"
            .github/shared/scripts/docker-subproject-image-pull.sh packages/docker/dennis-i18n "$IMAGE_REGISTRY" "$IMAGE_REPOSITORY_PREFIX/dennis-i18n" "$DENNIS_I18N_IMAGE_TAG"

      # no separate 'build necessary dockers' step: scripts/lint.sh builds the
      # images the selected linters need itself, and skips the ones the pull
      # above already restored
      - uses: './.github/shared/actions/devcontainer-shell-run'
        name: lint_project
        with:
          runCmd: |
            pnpm run lint

      # a no-op when both pulls hit above - docker-subproject-image-push.sh then
      # skips the login + registry round trip per image
      - uses: './.github/shared/actions/devcontainer-shell-run'
        name: publish lint images
        with:
          env: |
            IMAGE_REGISTRY=${{ env.IMAGE_REGISTRY }}
            IMAGE_REPOSITORY_PREFIX=${{ env.DOCKER_SUBPROJECT_IMAGE_REPOSITORY_PREFIX }}
            ECS_PHP_IMAGE_TAG=${{ steps.ecs_php_image_tag.outputs.tag }}
            DENNIS_I18N_IMAGE_TAG=${{ steps.dennis_i18n_image_tag.outputs.tag }}
            IMAGE_REGISTRY_USERNAME=${{ env.DOCKER_SUBPROJECT_IMAGE_REGISTRY_USERNAME }}
            IMAGE_REGISTRY_PASSWORD=${{ env.DOCKER_SUBPROJECT_IMAGE_REGISTRY_PASSWORD }}
          runCmd: |
            .github/shared/scripts/docker-subproject-image-push.sh packages/docker/ecs-php "$IMAGE_REGISTRY" "$IMAGE_REPOSITORY_PREFIX/ecs-php" "$ECS_PHP_IMAGE_TAG"
            .github/shared/scripts/docker-subproject-image-push.sh packages/docker/dennis-i18n "$IMAGE_REGISTRY" "$IMAGE_REPOSITORY_PREFIX/dennis-i18n" "$DENNIS_I18N_IMAGE_TAG"

