#
# this is the integration workflow that is triggered by a push to the develop branches
#
# it will
# - build the project
# - test the project
# - gather the workflow artifacts
#
name: 'integration'

on:
  push:
    # run for all branches except main (because testing is also done in pre-release workflow)
    branches-ignore:
      - 'main'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  # write-all is too much, but we need to write to packages
  # see https://github.com/orgs/community/discussions/57724 for more info
  contents: read
  packages: write
  attestations: write
  id-token: write

env:
  # registry/repository the wp-alpine image is published to (see
  # build-wp-alpine-image.yaml) - same repo vars/defaults, never hardcoded
  IMAGE_REGISTRY: ${{ vars.IMAGE_REGISTRY || 'ghcr.io' }}
  IMAGE_REPOSITORY: ${{ vars.IMAGE_REPOSITORY || 'ionos-wordpress/wp-alpine-dev' }}
  # registry repository prefix the rector-php/ecs-php/potrans/dennis-i18n
  # docker sub-project images (packages/docker/*) are cached under, one
  # repository per sub-project (e.g. ionos-wordpress/rector-php) - same
  # registry as wp-alpine, same vars/defaults convention, never hardcoded
  DOCKER_SUBPROJECT_IMAGE_REPOSITORY_PREFIX: ${{ vars.IMAGE_REPOSITORY_PREFIX || 'ionos-wordpress' }}
  DOCKER_SUBPROJECT_IMAGE_REGISTRY_USERNAME: ${{ secrets.IMAGE_REGISTRY_USERNAME || github.actor }}
  DOCKER_SUBPROJECT_IMAGE_REGISTRY_PASSWORD: ${{ secrets.IMAGE_REGISTRY_PASSWORD || secrets.GITHUB_TOKEN }}

jobs:
  devcontainer:
    uses: ./.github/workflows/build-devcontainer-image.yaml
    secrets: inherit

  build:
    name: build and test
    runs-on: ubuntu-latest
    needs:
      - devcontainer
    steps:
      - name: checkout branch from git
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: './.github/shared/actions/devcontainer-shell-run'
        name: install project
        with:
          runCmd: |
            pnpm install --frozen-lockfile

      - uses: './.github/shared/actions/devcontainer-shell-run'
        name: pull prebuilt wp-alpine image
        with:
          env: |
            IMAGE_REGISTRY=${{ env.IMAGE_REGISTRY }}
            IMAGE_REPOSITORY=${{ env.IMAGE_REPOSITORY }}
            IMAGE_REGISTRY_USERNAME=${{ github.repository_owner }}
            IMAGE_REGISTRY_PASSWORD=${{ secrets.GITHUB_TOKEN }}
          # tags a local ionos-wordpress/wp-alpine:<version> from the image built/
          # published by build-wp-alpine-image.yaml (Phase 1), so scripts/build.sh's
          # existing "already exists locally" check skips rebuilding it below - no
          # hard dependency on that workflow finishing first: falls back to a local
          # build (today's behavior) if the tag isn't published yet/pull fails
          runCmd: |
            HASH="$(git rev-parse HEAD:packages/docker/wp-alpine)"
            IMAGE="${IMAGE_REGISTRY}/${IMAGE_REPOSITORY}:${HASH}-php8.4"
            echo "$IMAGE_REGISTRY_PASSWORD" | docker login "$IMAGE_REGISTRY" --username "$IMAGE_REGISTRY_USERNAME" --password-stdin
            if docker pull "$IMAGE"; then
              PACKAGE_VERSION="$(jq -r '.version' packages/docker/wp-alpine/package.json)"
              docker tag "$IMAGE" "ionos-wordpress/wp-alpine:${PACKAGE_VERSION}"
              docker tag "$IMAGE" ionos-wordpress/wp-alpine:latest
              touch packages/docker/wp-alpine/build-info
            else
              echo "::warning::could not pull prebuilt wp-alpine image $IMAGE - falling back to a local build"
            fi

      - uses: './.github/shared/actions/docker-subproject-image-name'
        id: rector_php_image_tag
        with:
          path: packages/docker/rector-php

      - uses: './.github/shared/actions/devcontainer-shell-run'
        name: pull prebuilt rector-php image
        with:
          env: |
            IMAGE_REGISTRY=${{ env.IMAGE_REGISTRY }}
            IMAGE_REPOSITORY=${{ env.DOCKER_SUBPROJECT_IMAGE_REPOSITORY_PREFIX }}/rector-php
            IMAGE_TAG=${{ steps.rector_php_image_tag.outputs.tag }}
            IMAGE_REGISTRY_USERNAME=${{ env.DOCKER_SUBPROJECT_IMAGE_REGISTRY_USERNAME }}
            IMAGE_REGISTRY_PASSWORD=${{ env.DOCKER_SUBPROJECT_IMAGE_REGISTRY_PASSWORD }}
          # runs inside the devcontainer's docker-in-docker daemon - the same one
          # scripts/build.sh's docker build step below runs in - so the pulled/
          # tagged image is actually visible to it (a host-side docker pull/tag
          # would land in a different daemon and be invisible to the build step)
          runCmd: |
            .github/shared/scripts/docker-subproject-image-pull.sh packages/docker/rector-php "$IMAGE_REGISTRY" "$IMAGE_REPOSITORY" "$IMAGE_TAG"

      - uses: './.github/shared/actions/devcontainer-shell-run'
        name: build project
        with:
          runCmd: |
            # only build what the test suite actually consumes: the plugins/mu-plugins
            # themselves (bundled JS/CSS, i18n) plus rector-php, which their build step
            # shells out to for PHP-version transpilation. ecs-php/potrans/dennis-i18n
            # are declared workspace deps too, but only used by scripts/lint.sh - building
            # them here would be wasted work. wp-alpine is already pulled/tagged above.
            pnpm run build --filter './packages/wp-plugin/*' --filter './packages/wp-mu-plugin/*' --filter '@ionos-wordpress/rector-php'

      - uses: './.github/shared/actions/devcontainer-shell-run'
        name: publish rector-php image
        with:
          env: |
            IMAGE_REGISTRY=${{ env.IMAGE_REGISTRY }}
            IMAGE_REPOSITORY=${{ env.DOCKER_SUBPROJECT_IMAGE_REPOSITORY_PREFIX }}/rector-php
            IMAGE_TAG=${{ steps.rector_php_image_tag.outputs.tag }}
            IMAGE_REGISTRY_USERNAME=${{ env.DOCKER_SUBPROJECT_IMAGE_REGISTRY_USERNAME }}
            IMAGE_REGISTRY_PASSWORD=${{ env.DOCKER_SUBPROJECT_IMAGE_REGISTRY_PASSWORD }}
          runCmd: |
            .github/shared/scripts/docker-subproject-image-push.sh packages/docker/rector-php "$IMAGE_REGISTRY" "$IMAGE_REPOSITORY" "$IMAGE_TAG"

      - uses: './.github/shared/actions/devcontainer-shell-run'
        name: test project
        with:
          runCmd: |
            TEST_PRODUCTION=true pnpm run test

      - uses: './.github/shared/actions/devcontainer-shell-run'
        id: gather_workflow_artifacts
        name: gather_workflow_artifacts
        if: always()
        continue-on-error: true
        with:
          runCmd: |
            pnpm exec ./scripts/_get-workflow-artefacts.sh

      - name: attach workflow artifacts
        uses: actions/upload-artifact@v7
        if: steps.gather_workflow_artifacts.outcome == 'success' && steps.gather_workflow_artifacts.outputs.runCmdOutput != ''
        with:
          include-hidden-files: true
          # see https://github.com/actions/upload-artifact/issues/424
          path: |-
            ${{ steps.gather_workflow_artifacts.outputs.runCmdOutput }}

  lint:
    runs-on: ubuntu-latest
    needs:
      - devcontainer
    steps:
      - name: checkout branch from git
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: './.github/shared/actions/devcontainer-shell-run'
        name: install
        with:
          runCmd: |
            pnpm install --frozen-lockfile
      - uses: './.github/shared/actions/docker-subproject-image-name'
        id: ecs_php_image_tag
        with:
          path: packages/docker/ecs-php
      - uses: './.github/shared/actions/docker-subproject-image-name'
        id: potrans_image_tag
        with:
          path: packages/docker/potrans
      - uses: './.github/shared/actions/docker-subproject-image-name'
        id: dennis_i18n_image_tag
        with:
          path: packages/docker/dennis-i18n

      - uses: './.github/shared/actions/devcontainer-shell-run'
        name: pull prebuilt ecs-php image
        with:
          env: |
            IMAGE_REGISTRY=${{ env.IMAGE_REGISTRY }}
            IMAGE_REPOSITORY=${{ env.DOCKER_SUBPROJECT_IMAGE_REPOSITORY_PREFIX }}/ecs-php
            IMAGE_TAG=${{ steps.ecs_php_image_tag.outputs.tag }}
            IMAGE_REGISTRY_USERNAME=${{ env.DOCKER_SUBPROJECT_IMAGE_REGISTRY_USERNAME }}
            IMAGE_REGISTRY_PASSWORD=${{ env.DOCKER_SUBPROJECT_IMAGE_REGISTRY_PASSWORD }}
          runCmd: |
            .github/shared/scripts/docker-subproject-image-pull.sh packages/docker/ecs-php "$IMAGE_REGISTRY" "$IMAGE_REPOSITORY" "$IMAGE_TAG"

      - uses: './.github/shared/actions/devcontainer-shell-run'
        name: pull prebuilt potrans image
        with:
          env: |
            IMAGE_REGISTRY=${{ env.IMAGE_REGISTRY }}
            IMAGE_REPOSITORY=${{ env.DOCKER_SUBPROJECT_IMAGE_REPOSITORY_PREFIX }}/potrans
            IMAGE_TAG=${{ steps.potrans_image_tag.outputs.tag }}
            IMAGE_REGISTRY_USERNAME=${{ env.DOCKER_SUBPROJECT_IMAGE_REGISTRY_USERNAME }}
            IMAGE_REGISTRY_PASSWORD=${{ env.DOCKER_SUBPROJECT_IMAGE_REGISTRY_PASSWORD }}
          runCmd: |
            .github/shared/scripts/docker-subproject-image-pull.sh packages/docker/potrans "$IMAGE_REGISTRY" "$IMAGE_REPOSITORY" "$IMAGE_TAG"

      - uses: './.github/shared/actions/devcontainer-shell-run'
        name: pull prebuilt dennis-i18n image
        with:
          env: |
            IMAGE_REGISTRY=${{ env.IMAGE_REGISTRY }}
            IMAGE_REPOSITORY=${{ env.DOCKER_SUBPROJECT_IMAGE_REPOSITORY_PREFIX }}/dennis-i18n
            IMAGE_TAG=${{ steps.dennis_i18n_image_tag.outputs.tag }}
            IMAGE_REGISTRY_USERNAME=${{ env.DOCKER_SUBPROJECT_IMAGE_REGISTRY_USERNAME }}
            IMAGE_REGISTRY_PASSWORD=${{ env.DOCKER_SUBPROJECT_IMAGE_REGISTRY_PASSWORD }}
          runCmd: |
            .github/shared/scripts/docker-subproject-image-pull.sh packages/docker/dennis-i18n "$IMAGE_REGISTRY" "$IMAGE_REPOSITORY" "$IMAGE_TAG"

      - uses: './.github/shared/actions/devcontainer-shell-run'
        name: build necessary dockers
        with:
          runCmd: |
            pnpm run build --filter ecs-php --filter dennis-i18n
      - uses: './.github/shared/actions/devcontainer-shell-run'
        name: lint_project
        with:
          runCmd: |
            pnpm run lint

      - uses: './.github/shared/actions/devcontainer-shell-run'
        name: publish ecs-php image
        with:
          env: |
            IMAGE_REGISTRY=${{ env.IMAGE_REGISTRY }}
            IMAGE_REPOSITORY=${{ env.DOCKER_SUBPROJECT_IMAGE_REPOSITORY_PREFIX }}/ecs-php
            IMAGE_TAG=${{ steps.ecs_php_image_tag.outputs.tag }}
            IMAGE_REGISTRY_USERNAME=${{ env.DOCKER_SUBPROJECT_IMAGE_REGISTRY_USERNAME }}
            IMAGE_REGISTRY_PASSWORD=${{ env.DOCKER_SUBPROJECT_IMAGE_REGISTRY_PASSWORD }}
          runCmd: |
            .github/shared/scripts/docker-subproject-image-push.sh packages/docker/ecs-php "$IMAGE_REGISTRY" "$IMAGE_REPOSITORY" "$IMAGE_TAG"

      - uses: './.github/shared/actions/devcontainer-shell-run'
        name: publish potrans image
        with:
          env: |
            IMAGE_REGISTRY=${{ env.IMAGE_REGISTRY }}
            IMAGE_REPOSITORY=${{ env.DOCKER_SUBPROJECT_IMAGE_REPOSITORY_PREFIX }}/potrans
            IMAGE_TAG=${{ steps.potrans_image_tag.outputs.tag }}
            IMAGE_REGISTRY_USERNAME=${{ env.DOCKER_SUBPROJECT_IMAGE_REGISTRY_USERNAME }}
            IMAGE_REGISTRY_PASSWORD=${{ env.DOCKER_SUBPROJECT_IMAGE_REGISTRY_PASSWORD }}
          runCmd: |
            .github/shared/scripts/docker-subproject-image-push.sh packages/docker/potrans "$IMAGE_REGISTRY" "$IMAGE_REPOSITORY" "$IMAGE_TAG"

      - uses: './.github/shared/actions/devcontainer-shell-run'
        name: publish dennis-i18n image
        with:
          env: |
            IMAGE_REGISTRY=${{ env.IMAGE_REGISTRY }}
            IMAGE_REPOSITORY=${{ env.DOCKER_SUBPROJECT_IMAGE_REPOSITORY_PREFIX }}/dennis-i18n
            IMAGE_TAG=${{ steps.dennis_i18n_image_tag.outputs.tag }}
            IMAGE_REGISTRY_USERNAME=${{ env.DOCKER_SUBPROJECT_IMAGE_REGISTRY_USERNAME }}
            IMAGE_REGISTRY_PASSWORD=${{ env.DOCKER_SUBPROJECT_IMAGE_REGISTRY_PASSWORD }}
          runCmd: |
            .github/shared/scripts/docker-subproject-image-push.sh packages/docker/dennis-i18n "$IMAGE_REGISTRY" "$IMAGE_REPOSITORY" "$IMAGE_TAG"

