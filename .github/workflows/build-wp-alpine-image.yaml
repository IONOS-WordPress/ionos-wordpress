#
# builds and publishes the ionos-wordpress Alpine dev/test image
# (packages/docker/wp-alpine) as two PHP variants (8.4 default, 8.3 - the
# project's stated minimum supported version, see AGENTS.md) to a container
# registry, tagged by content hash so identical Dockerfile/entrypoint content
# never rebuilds.
#
# registry/repository are configurable via repo-level Actions variables
# (IMAGE_REGISTRY/IMAGE_REPOSITORY), defaulting to GHCR - never hardcoded.
#

name: Build wp-alpine image

on:
  push:
    paths:
      - 'packages/docker/wp-alpine/**'
      - '.github/workflows/build-wp-alpine-image.yaml'

permissions:
  contents: read
  packages: write

env:
  IMAGE_REGISTRY: ${{ vars.IMAGE_REGISTRY || 'ghcr.io' }}
  IMAGE_REPOSITORY: ${{ vars.IMAGE_REPOSITORY || 'ionos-wordpress/wp-alpine-dev' }}

jobs:
  build:
    name: build (php ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - php: '8.4'
            alpine: '3.24'
          # - php: '8.3'
          #   alpine: '3.20'
    steps:
      - name: checkout branch from git
        uses: actions/checkout@v6

      - name: compute content-hash image tag
        id: image_tag
        run: |
          HASH="$(git rev-parse HEAD:packages/docker/wp-alpine)"
          echo "tag=${HASH}-php${{ matrix.php }}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.IMAGE_REGISTRY }}
          username: ${{ secrets.IMAGE_REGISTRY_USERNAME || github.actor }}
          password: ${{ secrets.IMAGE_REGISTRY_PASSWORD || secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/docker/wp-alpine/Dockerfile
          push: true
          build-args: |
            ARG_PHP_VERSION=${{ matrix.php }}
            ARG_ALPINE_VERSION=${{ matrix.alpine }}
          tags: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_REPOSITORY }}:${{ steps.image_tag.outputs.tag }}
